<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 575" role="img" aria-labelledby="title desc">
<title id="title">ADCS functional architecture</title><desc id="desc">Orbit and mission feed guidance. Guidance references and MEKF estimates feed a classical or learned controller. The supervisor selects modes and can override guidance. Wheel authority is inferred by FDIR from telemetry. Controller commands reach wheels and magnetic torquers, then spacecraft dynamics, then sensors, closing the loop. FDIR also informs supervisory decisions.</desc>
